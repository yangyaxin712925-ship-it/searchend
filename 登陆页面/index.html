<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="login-layout">
    <!-- 3D 画布：全屏固定层，独立于两侧面板，任何窗口宽度都可见 -->
    <div id="world"></div>

    <!-- 左侧：小狮子 3D 交互 -->
    <div class="lion-panel">
        <div id="instructions">风吹动鬃毛，小狮子正看着你...</div>
    </div>

    <!-- 右侧：登录 / 注册 -->
    <div class="login-right">
        <div class="container right-panel-active">
            <!-- 注册 -->
            <div class="container_form container--signup">
                <form action="#" class="form" id="form1" autocomplete="off">
                    <h2 class="form_title">Sign Up</h2>
                    <input type="text" placeholder="Username" class="input" name="username" required maxlength="50" />
                    <input type="text" placeholder="Nickname (optional)" class="input" name="nickname" maxlength="50" />
                    <input type="password" placeholder="Password" class="input" name="password" required minlength="6" />
                    <div class="form-msg" id="registerMsg"></div>
                    <button class="btn" type="submit">Sign Up</button>
                </form>
            </div>

            <!-- 登录 -->
            <div class="container_form container--signin">
                <form action="#" class="form" id="form2" autocomplete="off">
                    <h2 class="form_title">Sign In</h2>
                    <input type="text" placeholder="Username" class="input" name="username" required />
                    <input type="password" placeholder="Password" class="input" name="password" required />
                    <div class="form-msg" id="loginMsg"></div>
                    <button class="btn" type="submit">Sign In</button>
                </form>
            </div>

            <!-- 浮层 -->
            <div class="container_overlay">
                <div class="overlay">
                    <div class="overlay_panel overlay--left">
                        <button class="btn" id="signIn">Sign In</button>
                    </div>
                    <div class="overlay_panel overlay--right">
                        <button class="btn" id="signUp">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="./js/three.min.js"></script>
<script src="./js/OrbitControls.js"></script>
<script src="./js/script.js"></script>
<script src="./script.js"></script>
</body>
</html>
