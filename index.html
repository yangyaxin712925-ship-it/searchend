		<!-- 页面打通：保存登录态 + 新同学第一张图片 → 操作页面 -->
        <script>
            (function () {
                // 1. 保存登录页带回的 token，并清理地址栏参数（刷新不丢登录态）
                var params = new URLSearchParams(location.search)
                var token = params.get('token')
                if (token) {
                    localStorage.setItem('token', token)
                    if (params.get('user_id')) localStorage.setItem('user_id', params.get('user_id'))
                    if (params.get('username')) localStorage.setItem('username', params.get('username'))
                    history.replaceState({}, '', location.pathname)
                }
                // 2. 新同学类目下的第一张图片 → 候选人操作页面
                var firstItem = document.querySelector('#portfolio-grid .portfolio-item.branding.open-operation')
                if (firstItem) {
                    firstItem.addEventListener('click', function () {
                        var t = localStorage.getItem('token')
                        var url = '../操作页面/index.html'
                        if (t) url += '?token=' + encodeURIComponent(t)
                        window.location.href = url
                    })
                }
                // 3. 退出登录：清除登录态并跳转登录页
                document.addEventListener('click', function (e) {
                    var btn = e.target.closest && e.target.closest('.logout-btn')
                    if (!btn) return
                    e.preventDefault()
                    localStorage.removeItem('token')
                    localStorage.removeItem('user_id')
                    localStorage.removeItem('username')
                    window.location.href = '../登陆页面/index.html'
                })
                // 4. 已登录：邀约文案切换为“探索新知”，点击平滑下滑到下方作品区
                if (localStorage.getItem('token')) {
                    var inviteBtn = document.querySelector('.slider-content a.btn')
                    if (inviteBtn) {
                        inviteBtn.textContent = '探索新知'
                        inviteBtn.setAttribute('href', '#basic-portfolio-area')
                        inviteBtn.addEventListener('click', function (e) {
                            e.preventDefault()
                            var target = document.querySelector('.basic-portfolio-area')
                            if (target) target.scrollIntoView({ behavior: 'smooth' })
                        })
                    }
                }
            })()
        </script>
